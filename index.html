<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pesquisa Equipe Maxipark</title>
<meta name="theme-color" content="#1F6E6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pesquisa Equipe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --teal:#1F6E6E; --teal-dark:#155252; --teal-soft:#D6ECEC; --bg:#F1F5F5; --card:#FFFFFF;
    --text:#1B1F1F; --muted:#5A6B6B; --line:#D5DEDE; --sel:#FFD54F; --sel-text:#3A2E00;
    --danger:#B23A3A; --ok:#2E7D32; --radius:18px;
    color-scheme: light;   /* o app é sempre claro: evita texto claro do modo escuro do aparelho em botões e campos */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;color:var(--text)}
  details summary{color:var(--teal-dark)}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.35}
  body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  textarea,input,pre{-webkit-user-select:text;user-select:text}
  #app{min-height:100vh;display:flex;flex-direction:column}
  .top{background:var(--teal);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .top .brand{font-weight:700;font-size:17px}
  .top .step{font-size:15px;opacity:.92;text-align:right}
  .progress{height:6px;background:rgba(255,255,255,.25)}
  .progress > div{height:100%;background:var(--sel);transition:width .25s}
  .wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px calc(70px + env(safe-area-inset-bottom,0px))}
  .card{width:100%;max-width:820px;background:var(--card);border-radius:var(--radius);padding:22px 22px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  h1{font-size:28px;line-height:1.2;margin:0 0 10px;color:var(--teal-dark)}
  h2{font-size:23px;line-height:1.25;margin:0 0 12px}
  h3{font-size:19px;margin:18px 0 8px;color:var(--teal-dark)}
  p{margin:0 0 12px}
  ul.plain{margin:0 0 14px;padding-left:22px}
  ul.plain li{margin:6px 0;font-size:19px}
  .muted{color:var(--muted)}
  .small{font-size:15px}
  .notice{background:var(--teal-soft);border-radius:12px;padding:14px 16px;font-size:16px;margin:12px 0}
  .good{background:#E6F4EA;border:1px solid #9CCFA9;border-radius:12px;padding:12px 14px;margin:10px 0 14px;font-size:16px;color:#1B3D26}
  .datefield{padding:12px 14px;border:2px dashed var(--line);border-radius:12px;font-size:19px;font-weight:600;color:var(--teal-dark);background:#fff}
  details{margin:8px 0 14px}
  summary{cursor:pointer;color:var(--teal-dark);font-weight:600;font-size:16px;padding:8px 0}
  .dim{display:inline-block;background:var(--teal-soft);color:var(--teal-dark);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;margin-bottom:8px}
  .statement{font-size:26px;font-weight:600;line-height:1.3;margin:4px 0 18px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:16px;width:100%;min-height:68px;padding:10px 18px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:21px;font-weight:600;text-align:left;cursor:pointer;color:var(--text)}
  .opt .num{flex:0 0 46px;height:46px;border-radius:50%;background:var(--teal-soft);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
  .opt.sel{background:var(--sel);border-color:#E0B400;color:var(--sel-text)}
  .opt.sel .num{background:#fff;font-size:30px;line-height:1}
  .opt.alt{border-style:dashed;color:var(--muted);font-size:17px;font-weight:500;min-height:52px}
  .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;margin:8px 0 6px}
  .scale button{min-height:62px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:22px;font-weight:700;cursor:pointer;color:var(--text)}
  .scale button.sel{background:var(--sel);border-color:#E0B400;color:var(--sel-text)}
  .anchors{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:12px;gap:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 22px;border-radius:14px;border:0;background:var(--teal);color:#fff;font-size:19px;font-weight:600;cursor:pointer}
  .btn.block{width:100%}
  .btn.ghost{background:#fff;color:var(--teal-dark);border:2px solid var(--teal)}
  .btn.light{background:var(--teal-soft);color:var(--teal-dark)}
  .btn.danger{background:var(--danger)}
  .btn.link{background:transparent;color:var(--muted);font-weight:500;font-size:16px;min-height:44px;padding:8px 12px}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
  .row > .btn{flex:1 1 200px}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
  label{display:block;font-weight:600;margin:14px 0 6px}
  input[type=text],input[type=month],input[type=password],input[type=url],input[type=search],textarea,select{width:100%;font:inherit;font-size:19px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}
  textarea{min-height:140px;resize:vertical}
  textarea.obs{min-height:54px;font-size:16px;margin-top:12px;padding:8px 12px;border-style:dashed}
  .unitfield{display:flex;gap:10px;align-items:stretch}
  .unitfield input{flex:1}
  .unitfield .btn{flex:0 0 auto;min-height:0;padding:8px 16px;font-size:16px}
  .ulist{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:60vh;overflow:auto}
  .uitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;text-align:left;cursor:pointer;color:var(--text)}
  .uitem b{font-size:18px;color:var(--teal-dark)}
  .uitem span{font-size:14px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  th,td{border:1px solid var(--line);padding:6px 6px;text-align:center}
  th{background:var(--teal-soft);color:var(--teal-dark)}
  td.l,th.l{text-align:left}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:10px 0}
  .kpi div{background:var(--teal-soft);border-radius:12px;padding:12px;text-align:center}
  .kpi b{display:block;font-size:26px;color:var(--teal-dark)}
  .kpi span{font-size:13px;color:var(--muted)}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:12px auto}
  .pinpad button{min-height:62px;font-size:26px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--text)}
  .pinpad button.ok{background:var(--teal);border-color:var(--teal);color:#fff;font-size:20px;font-weight:700}
  .pinshow{text-align:center;font-size:34px;letter-spacing:12px;min-height:48px;margin:6px 0}
  .thanks{text-align:center;padding:36px 10px}
  .thanks .check{width:96px;height:96px;border-radius:50%;background:var(--ok);color:#fff;font-size:56px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:9}
  .toast.show{opacity:1}
  .corner{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.94);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.10)}
  .warn{background:#FFF4D6;border-left:5px solid #E0B400;padding:10px 14px;border-radius:8px;font-size:15px;margin:10px 0}
  .bad{background:#FBE3E3;border-left:5px solid var(--danger);padding:10px 14px;border-radius:8px;font-size:15px;margin:10px 0}
  pre{white-space:pre-wrap;font-size:13px;background:#F7F9F9;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto}
  .legend{font-size:13px;color:var(--muted);margin:6px 0 0}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
  .filters label{margin:0 0 4px;font-size:13px;color:var(--muted)}
  .filters select{font-size:16px;padding:8px 10px}
  .tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
  .tag.ok{background:#E6F4EA;color:#1E6B34}
  .tag.pend{background:#FBE3E3;color:#9B1C1C}
  .up{color:#1E6B34;font-weight:700} .down{color:var(--danger);font-weight:700}
  tr.cur td{background:#F1F8F4}
  .check{display:flex;gap:10px;align-items:center;font-weight:500;margin:10px 0 4px;font-size:16px}
  .check input{width:22px;height:22px}
  .obslist{padding-left:18px;font-size:15px} .obslist > li{margin:8px 0} .obslist ul{padding-left:18px;margin:4px 0}
  @media (max-width:560px){ .statement{font-size:23px} .scale{grid-template-columns:repeat(6,1fr)} h1{font-size:25px} .opt{font-size:19px} }
  @media (max-height:820px) and (orientation:landscape){
    .wrap{padding:10px 16px 60px} .card{padding:14px 18px} .statement{font-size:22px;margin:2px 0 10px}
    .opts{gap:8px} .opt{min-height:54px;padding:6px 14px;font-size:19px} .opt .num{flex-basis:38px;height:38px;font-size:17px}
    .spread{margin-top:10px} .dim{margin-bottom:4px} .scale button{min-height:50px} .top{padding-top:8px;padding-bottom:8px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<input type="file" id="file-unidades" accept=".csv,.txt,.xlsx,.xls" style="display:none">
<input type="file" id="file-hist" accept=".csv,.txt" multiple style="display:none">
<script>
'use strict';
/* =====================================================================
   Pesquisa com a equipe Maxipark — app de tablet (offline, sem nome)
   Parte B da ficha de Experiência do Cliente Interno.
   Escala de 3 respostas por frase (Sim / resposta do meio / Não) + "Não se aplica" onde faz sentido.
   Valores gravados: 3 = Sim, 2 = resposta do meio, 1 = Não, 'NA' = não se aplica.
   ===================================================================== */
const VERSAO = '1.5';
const ITENS = [
  {n:1,  dim:'Condições no posto', t:'Os equipamentos que uso no posto (cancela, máquina de cartão, sistema, rádio) funcionam bem.', opts:['Sim','Às vezes','Não']},
  {n:2,  dim:'Condições no posto', t:'Consigo parar para comer durante o meu turno.', opts:['Sim','Às vezes','Não']},
  {n:3,  dim:'Condições no posto', t:'No meu turno tem gente suficiente para atender bem.', opts:['Sim','Às vezes','Não']},
  {n:4,  dim:'Escala, pagamento e apoio do escritório', t:'Minhas folgas são respeitadas como estão na escala.', opts:['Sim','Às vezes','Não']},
  {n:5,  dim:'Escala, pagamento e apoio do escritório', t:'Meu pagamento (salário, vales, horas extras) vem certo.', opts:['Sim','Às vezes tem erro','Não']},
  {n:6,  dim:'Escala, pagamento e apoio do escritório', t:'Quando peço algo ao escritório da Maxipark (holerite, uniforme, ponto), resolvem em poucos dias.', opts:['Sim','Às vezes','Não'], na:'Não se aplica — nunca precisei pedir'},
  {n:7,  dim:'Escala, pagamento e apoio do escritório', t:'Recebi treinamento suficiente para fazer meu trabalho neste posto.', opts:['Sim','Em parte','Não']},
  {n:8,  dim:'Escala, pagamento e apoio do escritório', t:'Fico sabendo, com antecedência, das mudanças que afetam meu trabalho (posto, horário, regras).', opts:['Sim','Às vezes','Não']},
  {n:9,  dim:'Chefia e reconhecimento', t:'Meu chefe direto me trata com respeito.', opts:['Sim','Às vezes','Não']},
  {n:10, dim:'Chefia e reconhecimento', t:'Meu chefe direto é justo com todos da equipe.', opts:['Sim','Em parte','Não']},
  {n:11, dim:'Chefia e reconhecimento', t:'Meu chefe direto me ouve quando aviso um problema ou dou uma ideia.', opts:['Sim','Às vezes','Não']},
  {n:12, dim:'Chefia e reconhecimento', t:'Nos últimos 30 dias, meu chefe direto ou o supervisor elogiou meu trabalho.', opts:['Sim','Não lembro','Não']},
  {n:13, dim:'Segurança e apoio', t:'Me sinto seguro(a) no meu posto (risco de atropelamento, assalto, escuro à noite).', opts:['Sim','Em parte','Não']},
  {n:14, dim:'Segurança e apoio', t:'Se um motorista ou alguém do local me trata mal, a Maxipark me apoia.', opts:['Sim','Em parte','Não'], na:'Não se aplica — não aconteceu comigo'},
  {n:15, dim:'Futuro', t:'Vejo chance de crescer na Maxipark.', opts:['Sim','Talvez','Não']},
];
const VALOR = [3, 2, 1];   // opts[0] = Sim → 3, opts[1] = meio → 2, opts[2] = Não → 1
const ESCALA = 'B3';       // carimbo gravado em cada resposta e no CSV: 3 respostas por frase (v1.3+). Respostas sem carimbo são da escala 1-5 (v1.2)
const ENPS_Q = 'De 0 a 10, quanto você recomendaria a Maxipark a um amigo como um bom lugar para trabalhar?';
const CES_Q = 'Pense na última vez que você precisou resolver algo seu com o escritório da Maxipark (holerite, ponto, uniforme, sistema). Foi fácil resolver?';
const CES_OPTS = ['Sim, foi fácil', 'Mais ou menos', 'Não, foi difícil'];
const ABERTAS = ['O que mais atrapalha seu dia de trabalho nesta unidade hoje?', 'Se você pudesse mudar uma coisa na Maxipark, o que seria?'];
const AVISO = '<b>Sem nome.</b> O app não grava seu nome, cargo nem horário — só o código da unidade e o dia da visita, que é o mesmo para toda a equipe.<br><b>Quem vê suas respostas:</b> só a área de Experiência do Cliente da Maxipark, que aplica esta pesquisa. Seu chefe direto (encarregado ou supervisor) <b>não vê</b> o que você marcou, a nota de 0 a 10 nem o que você escreveu — ele recebe só um resumo, e junto com outras unidades quando a equipe é pequena.<br><b>Unidade com 1 ou 2 colaboradores:</b> como seria fácil saber quem respondeu, o resultado da sua unidade não é mostrado a ninguém fora dessa área. O retorno vem junto com as outras unidades da região.<br><b>Comentários:</b> a área de Experiência do Cliente lê o que você escreveu; para o encarregado e para a equipe vai só o assunto, nunca a frase.<br><b>Ninguém é obrigado</b> a responder.<br><b>Caso grave</b> (assédio, ameaça, acidente): use o canal de denúncia, que consegue voltar a falar com você; esta pesquisa não consegue.';
const GLOSSARIO = '<b>Chefe direto</b> = o encarregado da sua unidade (se não tem encarregado, é o supervisor regional). <b>Maxipark / empresa</b> = a Maxipark inteira: seu chefe direto, o supervisor e o escritório. <b>Escritório da Maxipark</b> = o pessoal de RH, pagamento, uniforme e sistemas, que fica fora do posto.';
// As contagens são geradas a partir de 1 resposta (há unidades com 1 só colaborador). Os limites abaixo valem para DIVULGAÇÃO, não para o cálculo.
const N_DIVULGA_FRASE = 3;   // abaixo disso as contagens identificam quem respondeu: uso restrito à área de Experiência do Cliente
const N_DIVULGA_DETALHE = 5; // eNPS, CES e comentários: só divulgar por unidade a partir daqui
const IDLE_MS = 120000;      // pesquisa abandonada: descarta e volta ao início
const PIN_MAX_FAILS = 5, PIN_LOCK_MS = 60000;
// PIN programado pelo gestor (pedido de 2026-09-09): já vem definido, sem a etapa "Crie o PIN". Pode ser trocado em Configurações → Trocar PIN.
// Atenção: este código é público (GitHub Pages); quem ler o arquivo conhece o PIN padrão.
const PIN_PADRAO = '2819', PIN_PADRAO_MARCA = '2819-2026-09-09';
// Senha separada para "Zerar todo o histórico" (pedido do gestor): padrão 5541, trocável em Configurações → Trocar senha de zerar.
const SENHA_ZERAR_PADRAO = '5541', SENHA_ZERAR_MARCA = '5541-2026-09-09';

/* Lista padrão de unidades (Grande São Paulo — do roteiro da ficha externa). Pode ser substituída pela importação do Excel/CSV. */
const UNIDADES_PADRAO = [
  ['GAZETA','Bela Vista'],['FIESP','Jardins'],['FL.PARA','Bela Vista'],['BP','Bela Vista'],
  ['HABITAT','Santa Cecília'],['LAV.ANGEL','Consolação'],['LAV.ANGEL II','Santa Cecília'],['ALTA.HIGIE','Higienópolis'],
  ['NSB','Jardim América'],['ALTA.JARD','Jardins'],['GARDEN','Cerqueira César'],['INCOR','Cerqueira César'],
  ['ACCAST','Aclimação'],['ACPRUDE','Liberdade'],['AC.PIRES','Liberdade'],['FL.JUND','Paraíso'],
  ['SAL.PARAI','Paraíso'],['SAL.VMARIA','Vila Clementino'],['DEL.MAIO','Vila Clementino'],['DEL.RICAJAF','Vila Mariana'],
  ['PAINEIRA','Vila da Saúde'],['LAV.LABAL','Ipiranga'],['A+MOOCA','Cambuci'],['DEL.MOOCA','Mooca'],
  ['A+MOEMA','Indianópolis'],['LAV.MOE','Indianópolis'],['SAL.MOE','Moema'],['MONTREAL','Moema'],
  ['FL.IBIRA','Ibirapuera'],['ALTA.IBIRA','Vila Mariana'],['VITA.REP','Moema'],['SAL.IBIRA','Planalto Paulista'],
  ['ALTA.CBEL','Campo Belo'],['DEL.BROK','Santo Amaro'],['PET.CBEL','Campo Belo'],['GLOBO.SP','Vila Cordeiro'],
  ['LAV.BORGAT','Santo Amaro'],['A+FLORA','Jd. Marajoara'],['DEL.WASLUIS','Jd. Marajoara'],['ALTA.PAN','Vila Andrade'],['DEL.JSUL','Vila Andrade'],['SAL.PORTAL','Vila Suzana'],
  ['FL.ITAIM','Vila Olímpia'],['DEL.ITAIM','Itaim Bibi'],['AC.ITAIM','Jardim Paulista'],
  ['QUITANDA','Pinheiros'],['DEL.PIN','Vila Madalena'],['ALTA.PIN','Vila Ida'],['FL.VILLA','Alto de Pinheiros'],
  ['FL.SUMA','Perdizes'],['CARL','Perdizes / Sumaré'],['DEL.POM','Pompeia'],
  ['CVLOP','Vila Romana'],['SAL.LAPA','Alto da Lapa'],['A+LAPA','Lapa'],
  ['LAV.LAPA','Lapa'],['BR.LAPA','Lapa'],['DEL.LAPA','Lapa'],['DEL.OSASCO','Centro / Osasco'],['SAL.OSASCO','Vila Yara / Osasco'],
  ['A+ALPHA','Alphaville / Barueri'],['RESERVA','Alphaville / Barueri'],['ARAGUAI','Alphaville / Barueri'],['DEL.ALPHA','Alphaville / Barueri'],
  ['SAL.TATUA','Vila Gomes Cardim'],['DEL.TATU','Tatuapé'],['FL.AFRA','Vila Carrão'],['ALTA.AFRAN','Jd. Anália Franco'],['LAV.AMARBUE','Penha de França'],
  ['LAV.DARZAN','Santana'],['SAL.SANTA','Jd. São Paulo'],['DEL.DUMVIL','Jd. São Paulo'],
  ['LAV.TUCUR','Tucuruvi'],['DEL.GUARU','Macedo / Guarulhos'],['A+GUARU','Centro / Guarulhos'],
  ['A+SAND','Santo André'],['DEL.SAND II','Santo André'],['DEL.SAND I','Centro / Santo André'],['DEL.SBC','Centro / S.B. Campo'],['FL.SBC','Centro / S.B. Campo'],
].map(a => ({ codigo:a[0], nome:a[1] }));   // lista padrão: só código e nome (local) — sem endereço; a lista completa da empresa vem pela importação

/* ---------------- armazenamento local (só neste tablet) ---------------- */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
const DEFAULT_SETTINGS = { pin:'', unidade:'', mes:'', data:'', rodada:'R1', webhook:'', exported:{}, pinFails:0, lockUntil:0 };   // sem nome do avaliador (pedido do gestor): o app não guarda nome de ninguém
let settings = Object.assign({}, DEFAULT_SETTINGS, LS.get('mp_settings', {}));
function saveSettings(){ LS.set('mp_settings', settings); }
if ('avaliador' in settings) { delete settings.avaliador; saveSettings(); }   // apaga o nome do avaliador gravado por versões anteriores
// PIN programado: aplica o PIN padrão uma única vez (também em tablets que já tinham outro PIN de teste); depois disso, um PIN trocado em Configurações é respeitado.
if (settings.pinPadraoAplicado !== PIN_PADRAO_MARCA) { settings.pin = PIN_PADRAO; settings.pinFails = 0; settings.lockUntil = 0; settings.pinPadraoAplicado = PIN_PADRAO_MARCA; saveSettings(); }
if (settings.senhaZerarAplicada !== SENHA_ZERAR_MARCA) { settings.senhaZerar = SENHA_ZERAR_PADRAO; settings.senhaZerarAplicada = SENHA_ZERAR_MARCA; saveSettings(); }
// Zerar histórico: apaga respostas, recusas, rodadas e importadas deste aparelho; mantém PIN, senha de zerar e lista de unidades.
function zerarHistorico(){
  ['mp_respostas', 'mp_recusas', 'mp_hist', 'mp_rodadas'].forEach(k => { try { localStorage.removeItem(k); } catch(e) {} });
  settings.exported = {}; settings.rodada = 'R1'; settings.unidade = ''; settings.mes = ''; settings.data = ''; saveSettings();
}
// Pedido do gestor (09/09/2026): ao atualizar para esta versão, cada tablet começa do zero (uma única vez, controlado pela marca abaixo).
const ZERAR_MARCA = 'zerar-2026-09-09';
if (settings.zeradoEm !== ZERAR_MARCA) { zerarHistorico(); settings.zeradoEm = ZERAR_MARCA; saveSettings(); }
function allResponses(){ return LS.get('mp_respostas', []); }
function saveResponses(list){ return LS.set('mp_respostas', list); }
/* Rodadas: cada "pesquisa" é uma rodada (R1, R2…). Uma nova rodada zera as contagens da coleta sem apagar nada; o histórico fica no Consolidado. */
function rodadas(){
  let l = LS.get('mp_rodadas', null);
  if (!Array.isArray(l) || !l.length) {
    const datas = allResponses().map(r => r.data || (r.mes ? r.mes + '-01' : '')).filter(Boolean).sort();
    l = [{ id:'R1', nome:'Rodada 1', inicio: datas[0] || hojeISO(), fim:'' }];
    LS.set('mp_rodadas', l);
  }
  return l;
}
function saveRodadas(l){ return LS.set('mp_rodadas', l); }
function rodadaDe(r){ return (r && r.rodada) || 'R1'; }   // respostas antigas (sem carimbo) pertencem à Rodada 1
function rodadaNome(id){ const x = rodadas().find(r => r.id === id); return x ? x.nome : (id || 'Rodada 1'); }
function garantirRodada(id){ const l = rodadas(); if (!l.find(r => r.id === id)) { l.push({ id, nome: 'Rodada ' + String(id).replace(/^R/, '') + ' (importada)', inicio:'', fim:'' }); saveRodadas(l); } }
function novaRodada(){
  const l = rodadas(); const atual = l.find(r => r.id === settings.rodada); if (atual) atual.fim = hojeISO();
  const n = Math.max(0, ...l.map(r => parseInt(String(r.id).replace(/^R/, ''), 10) || 0)) + 1;
  const nova = { id: 'R' + n, nome: 'Rodada ' + n, inicio: hojeISO(), fim:'' };
  l.push(nova); saveRodadas(l); settings.rodada = nova.id; saveSettings();
  return nova;
}
if (!settings.rodada) { settings.rodada = 'R1'; saveSettings(); }
// chaves antigas "unidade|AAAA-MM" (recusas e marcação de exportado) passam a "unidade|R1"
(function migrarChavesRodada(){
  const re = /\|\d{4}-\d{2}$/;
  const rec = LS.get('mp_recusas', {}); let mudou = false; const novo = {};
  Object.keys(rec).forEach(k => { const nk = re.test(k) ? k.replace(re, '|R1') : k; if (nk !== k) mudou = true; novo[nk] = (novo[nk] || 0) + (rec[k] || 0); });
  if (mudou) LS.set('mp_recusas', novo);
  const ex = settings.exported || {}; let m2 = false; const ne = {};
  Object.keys(ex).forEach(k => { const nk = re.test(k) ? k.replace(re, '|R1') : k; if (nk !== k) m2 = true; ne[nk] = ne[nk] || ex[k]; });
  if (m2) { settings.exported = ne; saveSettings(); }
})();
function key(u, r){ return (u || settings.unidade) + '|' + (r || settings.rodada); }
function currentResponses(){ return allResponses().filter(r => r.unidade === settings.unidade && rodadaDe(r) === settings.rodada); }
function otherKeys(){ const m = {}; allResponses().forEach(r => { const k = key(r.unidade, rodadaDe(r)); if (k !== key()) m[k] = (m[k] || 0) + 1; }); return m; }
function keyLabel(k){ const [u, r] = k.split('|'); return u + ' · ' + rodadaNome(r); }
function refusals(){ const m = LS.get('mp_recusas', {}); return m[key()] || 0; }
function addRefusal(){ const m = LS.get('mp_recusas', {}); m[key()] = (m[key()] || 0) + 1; LS.set('mp_recusas', m); }
function uid(){ return Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6); }
function shuffle(a){ const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }
function configured(){ return !!(settings.pin && settings.unidade && settings.mes); }
/* lista de unidades: importada (localStorage) ou padrão */
function unidades(){ const u = LS.get('mp_unidades', null); return (u && u.origem && Array.isArray(u.lista) && u.lista.length) ? u.lista : UNIDADES_PADRAO; }
function unidadesInfo(){ const u = LS.get('mp_unidades', null); return (u && u.origem) ? `${u.lista.length} unidades importadas (${u.origem})` : `${UNIDADES_PADRAO.length} unidades da lista padrão (Grande SP)`; }
function unidadePorCodigo(c){ return unidades().find(u => u.codigo === c) || null; }

const SURVEY_SCREENS = ['q','enps','ces','open'];

function captureObs(){

  const v = ta.value.trim().slice(0, 300);
  if (state.screen === 'q') { if (!current.c) current.c = Array(ITENS.length).fill(''); current.c[state.q] = v; }
  else if (state.screen === 'enps') current.cEnps = v; else if (state.screen === 'ces') current.cCes = v;
}
function obsAtual(screen, q){ if (!current) return ''; return screen === 'q' ? ((current.c || [])[q] || '') : screen === 'enps' ? (current.cEnps || '') : screen === 'ces' ? (current.cCes || '') : ''; }
function homeScreen(){ return configured() ? 'welcome' : 'setup'; }
function go(screen, extra){
  state.screen = screen; state.fin = false; Object.assign(state, extra || {});   // fin: chegou aqui por "Finalizar pesquisa"
  // fora das telas de resposta, a pesquisa em andamento só sobrevive na tela de erro de gravação, de PIN e de confirmação
  if (!SURVEY_SCREENS.includes(screen) && screen !== 'saveerror' && screen !== 'pin' && screen !== 'confirm') current = null;

}
function askConfirm(msg, onYes){ pendingConfirm = { msg, onYes, from: state.screen, q: state.q }; state.screen = 'confirm'; armIdle(); render(); window.scrollTo(0, 0); }
function discardAndHome(){ current = null; busy = false; pendingConfirm = null; go(homeScreen()); }
function armIdle(){
  clearTimeout(idleTimer);
  const inSurvey = () => SURVEY_SCREENS.includes(state.screen) || (state.screen === 'confirm' && pendingConfirm && SURVEY_SCREENS.includes(pendingConfirm.from));
  if (inSurvey()) idleTimer = setTimeout(() => { if (inSurvey()) discardAndHome(); }, IDLE_MS);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800); }
function mesLabel(m){ if(!m) return ''; const [y, mo] = m.split('-'); return mo + '/' + y; }
function validMes(m){ return /^\d{4}-(0[1-9]|1[0-2])$/.test(m || ''); }
// Data da coleta: preenchida automaticamente (dia/mês/ano de hoje); o mês de referência deriva dela. A mesma data vale para todos os

function hojeISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dataLabel(d){ if (!d) return ''; const [y, m, dd] = d.split('-'); return dd + '/' + m + '/' + y; }
function fixarData(){ settings.data = hojeISO(); settings.mes = settings.data.slice(0, 7); }

/* ---------------- cálculo das contagens ---------------- */
function tally(list){
  const items = ITENS.map(() => ({ c:[0,0,0], na:0, n:0 }));   // c[0] = Não (1), c[1] = meio (2), c[2] = Sim (3)
  const enps = { det:0, neu:0, pro:0, n:0 };
  const ces = { nao:0, meio:0, sim:0, np:0, n:0 };
  let coments = [], legado = 0, obsItens = ITENS.map(() => []), obsEnps = [], obsCes = [];
  list.forEach(resp => {
    if (resp.escala !== ESCALA) { legado++; return; }   // resposta de versão anterior (escala 1-5): não mistura
    resp.r.forEach((v, i) => {
      if (v === 'NA') items[i].na++;
      else if (v === 1 || v === 2 || v === 3) { items[i].c[v-1]++; items[i].n++; }
    });
    if (typeof resp.enps === 'number') { enps.n++; if (resp.enps <= 6) enps.det++; else if (resp.enps <= 8) enps.neu++; else enps.pro++; }
    if (resp.ces === 'NP') ces.np++;
    else if (resp.ces === 1 || resp.ces === 2 || resp.ces === 3) { ces.n++; if (resp.ces === 1) ces.nao++; else if (resp.ces === 2) ces.meio++; else ces.sim++; }
    if (resp.a1) coments.push(resp.a1);
    if (resp.a2) coments.push(resp.a2);
    (resp.c || []).forEach((txt, i) => { if (txt && obsItens[i]) obsItens[i].push(txt); });
    if (resp.cEnps) obsEnps.push(resp.cEnps);
    if (resp.cCes) obsCes.push(resp.cCes);
  });
  coments = shuffle(coments);   // nunca na ordem em que as pessoas responderam
  obsItens.forEach((l, i) => { obsItens[i] = shuffle(l); }); obsEnps = shuffle(obsEnps); obsCes = shuffle(obsCes);
  const nResp = list.length - legado;
  // tudo é calculado a partir de 1 resposta; os sinais abaixo só dizem o que pode ser DIVULGADO por unidade
  // 'poucas' só quando a unidade tem respostas suficientes mas a frase não (houve "Não se aplica"); com 1-2 respostas o banner vermelho já cobre
  items.forEach(it => { it.pctSim = it.n ? Math.round(it.c[2] / it.n * 100) : null; it.poucas = nResp >= N_DIVULGA_FRASE && it.n > 0 && it.n < N_DIVULGA_FRASE; });
  const enpsVal = enps.n ? Math.round((enps.pro - enps.det) / enps.n * 100) : null;
  const cesFacil = ces.n ? Math.round(ces.sim / ces.n * 100) : null;
  const totSim = items.reduce((a, it) => a + it.c[2], 0), totN = items.reduce((a, it) => a + it.n, 0);
  const pctSimGeral = totN ? Math.round(totSim / totN * 100) : null;
  const identificavel = nResp > 0 && nResp < N_DIVULGA_FRASE;          // 1 ou 2 pessoas: as contagens são as respostas delas
  const poucasDetalhe = nResp > 0 && nResp < N_DIVULGA_DETALHE;        // eNPS, CES e comentários: não divulgar por unidade
  const cesPoucas = ces.n > 0 && ces.n < N_DIVULGA_DETALHE;            // poucos precisaram do escritório
  return { items, enps, ces, coments, obsItens, obsEnps, obsCes, nResp, legado, enpsVal, cesFacil, pctSimGeral, identificavel, poucasDetalhe, cesPoucas };
}

function tallyText(t){
  const L = [];
  L.push(`Pesquisa equipe Maxipark v${VERSAO} (escala ${ESCALA}: 3 respostas por frase)\tUnidade: ${settings.unidade}\t${rodadaNome(settings.rodada)}\tMês: ${mesLabel(settings.mes)}\tData da coleta: ${settings.data ? dataLabel(settings.data) : '-'}\tRespostas: ${t.nResp}\tPreferiram não responder: ${refusals()}`);
  if (t.legado) L.push(`Atenção: ${t.legado} resposta(s) de versão anterior do app (escala 1-5) não entram nestas contagens — só no arquivo de respostas.`);
  if (!t.nResp) { L.push('Ainda não há respostas desta unidade e mês.'); return L.join('\n'); }
  if (t.identificavel) L.push(`ATENÇÃO: só ${t.nResp} resposta${t.nResp > 1 ? 's' : ''} — as contagens abaixo são as respostas de ${t.nResp === 1 ? 'uma pessoa' : 'duas pessoas'}. Uso restrito à área de Experiência do Cliente: digitar na ficha, sim; divulgar por unidade ou mostrar ao encarregado, não.`);
  else if (t.poucasDetalhe) L.push(`${t.nResp} respostas: pode digitar na ficha e divulgar Nota B e dimensões; eNPS, CES e comentários só se divulgam por unidade com ${N_DIVULGA_DETALHE} ou mais.`);
  L.push('Frase\tNão\tResposta do meio (rótulo)\tSim\tNão se aplica\tResponderam (sem N/A)\t% Sim');
  t.items.forEach((it, i) => L.push(`B${i+1}\t${it.c[0]}\t${it.c[1]} (${ITENS[i].opts[1]})\t${it.c[2]}\t${ITENS[i].na ? it.na : '-'}\t${it.n}\t${it.pctSim == null ? '-' : it.pctSim + '%' + (it.poucas ? ' *' : '')}`));
  if (t.items.some(it => it.poucas)) L.push(`(* = menos de ${N_DIVULGA_FRASE} responderam a essa frase; os outros marcaram "Não se aplica" — % frágil, não divulgar por unidade)`);
  L.push('Leitura: 3 = Sim, 2 = resposta do meio, 1 = Não. Em B12 "Não lembro" conta como não elogiado; em B15 "Talvez" não é meio-termo: leia essas duas só pelo % Sim.');
  L.push(`eNPS (0 a 10)\tDetratores 0-6: ${t.enps.det}\tNeutros 7-8: ${t.enps.neu}\tPromotores 9-10: ${t.enps.pro}\tn = ${t.enps.n}\t${t.enpsVal == null ? '' : 'eNPS = ' + t.enpsVal}`);
  L.push(`CES (escritório)\tNão, foi difícil: ${t.ces.nao}\tMais ou menos: ${t.ces.meio}\tSim, foi fácil: ${t.ces.sim}\tNunca precisei: ${t.ces.np}\t${t.cesFacil == null ? '' : '% fácil = ' + t.cesFacil + '%'}${t.cesPoucas ? ' (menos de ' + N_DIVULGA_DETALHE + ' precisaram do escritório)' : ''}`);
  if (t.poucasDetalhe) L.push(`(eNPS e CES: não divulgar por unidade com menos de ${N_DIVULGA_DETALHE} respostas)`);
  return L.join('\n');
}

function csvText(list){
  // escala B3: B1-B15 → 3 = Sim, 2 = resposta do meio, 1 = Não, NA = não se aplica; CES → 3 = fácil, 2 = mais ou menos, 1 = difícil, NP = nunca precisei.
  // Linhas sem carimbo (escala B5) vêm da v1.2, com notas de 1 a 5. Sem linha de legenda: o arquivo é só dados, uma pessoa por linha.
  const head = ['versao','escala','id','unidade','mes','data','rodada', ...ITENS.map(it => 'B' + it.n), 'eNPS', 'CES', 'aberta1', 'aberta2', ...ITENS.map(it => 'cB' + it.n), 'cENPS', 'cCES'];   // data = dia da coleta; rodada = R1, R2…; cB1… = comentário escrito na página da frase
  const q = v => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = shuffle(list).map(r => [r.versao || '1.2', r.escala || 'B5', r.id, r.unidade, r.mes, r.data || '', rodadaDe(r), ...r.r.map(v => v == null ? '' : v), r.enps == null ? '' : r.enps, r.ces == null ? '' : r.ces, r.a1, r.a2, ...ITENS.map((it, i) => (r.c || [])[i] || ''), r.cEnps || '', r.cCes || ''].map(q).join(';'));
  return '﻿' + head.join(';') + '\n' + rows.join('\n') + '\n';
}

function poolConsolidado(){
  const seen = new Set(), lista = []; let legado = 0;
  allResponses().concat(histResponses()).forEach(r => { if (!r || !r.id || seen.has(r.id)) return; seen.add(r.id); if (r.escala !== ESCALA) { legado++; return; } lista.push(r); });

}
function agregar(list){   // um grupo de respostas (uma unidade ou todas)
  const a = { n: list.length, totSim: 0, totN: 0, enps: { n:0, pro:0, det:0 }, ces: { n:0, sim:0 }, itens: ITENS.map(() => ({ c:[0,0,0], na:0, n:0 })) };
  list.forEach(r => {
    (r.r || []).forEach((v, i) => { const it = a.itens[i]; if (!it) return; if (v === 'NA') it.na++; else if (v === 1 || v === 2 || v === 3) { it.c[v-1]++; it.n++; a.totN++; if (v === 3) a.totSim++; } });
    if (typeof r.enps === 'number') { a.enps.n++; if (r.enps <= 6) a.enps.det++; else if (r.enps >= 9) a.enps.pro++; }
    if (r.ces === 1 || r.ces === 2 || r.ces === 3) { a.ces.n++; if (r.ces === 3) a.ces.sim++; }
  });

function parseDelimited(text){
  const lines = text.replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const delim = (lines[0].match(/\t/g) || []).length ? '\t' : ((lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',');
  const split = l => { const out = []; let cur = '', inQ = false; for (const ch of l) { if (ch === '"') inQ = !inQ; else if (ch === delim && !inQ) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(s => s.trim()); };
  return lines.map(split);

function rowsToUnidades(rows){

  const head = rows[0].map(norm);
  // cabeçalho só se a 1ª coluna parece "código/unidade" ou se 2+ colunas COMEÇAM com nome de campo (evita descartar uma unidade cujo bairro é "Cidade Jardim")
  const looksHeader = /^(cod|unid|sigla)/.test(head[0]) || head.filter(h => /^(nome|cliente|ender|logradouro|bairro|cidade|munic|regi)/.test(h)).length >= 2;
  let idx = { codigo:0, nome:1, endereco:2, bairro:3, regiao:4 };
  if (looksHeader) {
    const find = re => head.findIndex(h => re.test(h));
    idx = { codigo: find(/cod|unid|sigla/), nome: find(/nome|cliente|site|local/), endereco: find(/ender|rua|logradouro/), bairro: find(/bairro|cidade|munic/), regiao: find(/regi|zona|roteiro/) };   // colunas de pessoas (supervisor, encarregado) são ignoradas de propósito
    if (idx.codigo < 0) idx.codigo = 0;
  }
  const body = looksHeader ? rows.slice(1) : rows;
  const seen = new Set(); const out = [];
  body.forEach(r => {
    const codigo = String(r[idx.codigo] || '').trim().toUpperCase();
    if (!codigo || seen.has(codigo)) return; seen.add(codigo);
    const g = i => (i >= 0 && r[i] != null) ? String(r[i]).trim() : '';
    out.push({ codigo, nome: g(idx.nome), endereco: g(idx.endereco), bairro: g(idx.bairro), regiao: g(idx.regiao) });
  });
  return out;
}

  if (!lista.length) { toast('Nenhuma unidade encontrada. Confira se a primeira coluna é o código.'); return false; }
  if (!LS.set('mp_unidades', { origem, lista, quando: settings.mes })) { toast('Não foi possível gravar a lista neste aparelho.'); return false; }
  toast(`${lista.length} unidades importadas.`); return true;
}
function loadSheetJS(){
  return new Promise((resolve, reject) => {
    if (window.XLSX) return resolve(window.XLSX);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => resolve(window.XLSX); s.onerror = () => reject(new Error('sem internet'));
    document.head.appendChild(s);
  });
}
async function importFile(file){
  try {
    const name = (file.name || '').toLowerCase();
    let rows;
    if (/\.xlsx?$/.test(name)) {
      let XLSX; try { XLSX = await loadSheetJS(); } catch(e) { toast('Para ler .xlsx é preciso internet na primeira vez. Sem internet, salve como CSV no Excel e importe o CSV.'); return; }
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }).map(r => r.map(c => String(c == null ? '' : c).trim())).filter(r => r.some(Boolean));
    } else {
      const text = await file.text();
      rows = parseDelimited(text);
    }
    if (saveUnidades(rowsToUnidades(rows), 'arquivo ' + file.name)) render();
  } catch(e) { toast('Não consegui ler o arquivo: ' + (e && e.message ? e.message : e)); }
}

/* ---------------- ações ---------------- */
function markExported(){ settings.exported[key()] = true; saveSettings(); }

function submitCurrent(){
  if (busy || !current) return;
  busy = true;
  const list = allResponses();
  const pos = Math.floor(Math.random() * (list.length + 1));   // posição aleatória: a ordem não revela quem respondeu
  list.splice(pos, 0, current);
  if (!saveResponses(list)) { busy = false; go('saveerror'); return; }
  current = null; busy = false;
  startThanks();
}

async function sendPending(){
  if (sending || !settings.webhook) return;
  sending = true;
  const pend = shuffle(allResponses().filter(r => !r.sent));
  let ok = 0;
  for (const r of pend) {
    try {
      const payload = { app:'pesquisa-equipe-maxipark', versao:r.versao || '1.2', escala:r.escala || 'B5', id:r.id, unidade:r.unidade, mes:r.mes, data:r.data || '', rodada:rodadaDe(r), respostas:r.r, enps:r.enps, ces:r.ces, aberta1:r.a1, aberta2:r.a2, comentarios:(r.c || []), comentario_enps:r.cEnps || '', comentario_ces:r.cCes || '', recusas_unidade_rodada:(LS.get('mp_recusas', {})[key(r.unidade, rodadaDe(r))] || 0) };
      await fetch(settings.webhook, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
      const list = allResponses(); const it = list.find(x => x.id === r.id); if (it) { it.sent = true; saveResponses(list); }
      ok++;
    } catch(e) { /* sem rede: fica pendente */ }
  }
  sending = false;
  if (ok) markExported();
  if (state.screen === 'admin') { toast(ok === pend.length ? 'Tudo enviado à matriz.' : `${ok} enviada(s); ${pend.length - ok} ainda pendente(s).`); render(); }
}

async function shareOrDownload(name, text){
  try {
    if (navigator.share && navigator.canShare) {
      const file = new File([text], name, { type: 'text/csv' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
    }
  } catch(e) { if (e && e.name === 'AbortError') return false; }
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return true;
}
async function exportCsv(){
  const ok = await shareOrDownload(`pesquisa_${settings.unidade}_${settings.rodada}_${settings.data || settings.mes}.csv`, csvText(currentResponses()));
  if (ok) { markExported(); render(); }
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast('Contagens copiadas.'); markExported(); render(); }
  catch(e) { go('text', { showText: text }); toast('Toque e segure no texto para copiar.'); markExported(); }
}
function readUnitInput(prefix){ const el = document.getElementById(prefix + '-unidade'); return el ? el.value.trim().toUpperCase() : settings.unidade; }

function handle(action, el){
  const list = () => currentResponses();
  switch(action){
    case 'start': {
      const u = readUnitInput('f');
      if (!u) { toast('Escolha a unidade.'); return; }
      if (!settings.pin) { toast('Defina o PIN do avaliador primeiro.'); return; }
      settings.unidade = u; fixarData(); saveSettings();   // data da coleta = hoje, automática
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      go('welcome'); break;
    }
    case 'pickunit': {
      // guarda o que já foi digitado nas outras caixas antes de trocar de tela
      const ret = el.getAttribute('data-ret') || 'setup';
      go('unidades', { pickReturn: ret, filtro: '' }); break;
    }
    case 'chooseunit': settings.unidade = el.getAttribute('data-c'); saveSettings(); toast('Unidade: ' + settings.unidade); go(state.pickReturn || 'setup'); break;
    case 'cancelpick': go(state.pickReturn || 'setup'); break;
    case 'importfile': document.getElementById('file-unidades').click(); break;
    case 'pastelist': go('colar'); break;
    case 'importpaste': { const t = document.getElementById('c-lista').value; if (saveUnidades(rowsToUnidades(parseDelimited(t)), 'lista colada')) go('settings'); break; }
    case 'resetlist': askConfirm('Voltar à lista padrão de unidades (Grande SP)? A lista importada será removida deste tablet.', () => { localStorage.removeItem('mp_unidades'); toast('Lista padrão restaurada.'); go('settings'); }); break;
    case 'install': if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; render(); } break;
    case 'gosetpin': state.newPin = ''; state.newPinStage = 0; state.newPinFirst = ''; state.setPinMode = 'pin'; go('setpin'); break;
    case 'gosetzerar': state.newPin = ''; state.newPinStage = 0; state.newPinFirst = ''; state.setPinMode = 'zerar'; go('setpin'); break;
    case 'cancelsetpin': go(settings.pin ? 'settings' : 'setup'); break;
    case 'newpinkey': {
      const k = el.getAttribute('data-k');
      if (k === '←') state.newPin = state.newPin.slice(0, -1);
      else if (k === 'OK') {
        if (state.newPinStage !== 1) {
          if (!/^\d{4,8}$/.test(state.newPin)) { toast('Use de 4 a 8 números e toque em OK.'); return; }
          if (['1234','0000','1111','2222','123456','12345678'].includes(state.newPin)) { toast('PIN muito fácil. Escolha outro.'); state.newPin = ''; render(); return; }
          state.newPinFirst = state.newPin; state.newPin = ''; state.newPinStage = 1; render(); return;
        }
        if (state.newPin !== state.newPinFirst) { toast('Os números não conferem. Comece de novo.'); state.newPin = ''; state.newPinFirst = ''; state.newPinStage = 0; render(); return; }
        if (state.setPinMode === 'zerar') {
          if (state.newPin === settings.pin) { toast('A senha de zerar não pode ser igual ao PIN do avaliador.'); state.newPin = ''; state.newPinFirst = ''; state.newPinStage = 0; render(); return; }
          settings.senhaZerar = state.newPin; saveSettings(); state.newPin = ''; state.newPinFirst = ''; state.newPinStage = 0;
          toast('Senha de zerar definida.'); go('settings'); return;
        }
        if (state.newPin === (settings.senhaZerar || SENHA_ZERAR_PADRAO)) { toast('O PIN não pode ser igual à senha de zerar.'); state.newPin = ''; state.newPinFirst = ''; state.newPinStage = 0; render(); return; }
        settings.pin = state.newPin; settings.pinFails = 0; settings.lockUntil = 0; saveSettings(); state.newPin = ''; state.newPinFirst = ''; state.newPinStage = 0;
        toast('PIN definido.'); go(settings.unidade && settings.mes ? 'settings' : 'setup'); return;
      } else if (state.newPin.length < 8) state.newPin += k;
      render(); break;
    }
    case 'begin': current = novaResposta(); busy = false; go('q', { q: 0 }); break;
    case 'refuse': addRefusal(); startThanks(); break;
    case 'quit': askConfirm('Desistir da pesquisa? Nada será gravado.', () => { current = null; startThanks(); }); break;
    case 'confirmyes': { const p = pendingConfirm; pendingConfirm = null; if (p) p.onYes(); break; }
    case 'confirmno': { const p = pendingConfirm; pendingConfirm = null; state.screen = p ? p.from : homeScreen(); state.q = p ? p.q : 0; armIdle(); render(); break; }
    case 'answer': {
      if (!current) return;
      const raw = el.getAttribute('data-val');
      const v = (raw === 'NA' || raw === 'NP') ? raw : Number(raw);
      const screen = state.screen, q = state.q, token = ++answerToken;
      captureObs();
      if (screen === 'q') current.r[q] = v; else if (screen === 'enps') current.enps = v; else if (screen === 'ces') current.ces = v; else return;
      render(); armIdle();   // sem avanço automático: a pessoa toca em "Próxima" quando terminar (inclusive o comentário)
      break;
    }
    case 'next': advance(); break;
    case 'back': back(); break;
    case 'nextperson': clearTimeout(thanksTimer); go('welcome'); break;
    case 'retrysave': submitCurrent(); break;
    case 'pin': state.pin = ''; state.pinTarget = el.getAttribute('data-target') || 'admin'; state.pinFin = el.getAttribute('data-fin') === '1'; go('pin'); break;
    case 'cancelpin': current = null; go(homeScreen()); break;
    case 'pinkey': {
      if (Date.now() < (settings.lockUntil || 0)) return;
      const k = el.getAttribute('data-k');
      if (k === '←') state.pin = state.pin.slice(0, -1);
      else if (k === 'OK') {
        const alvo = state.pinTarget === 'zerar' ? (settings.senhaZerar || SENHA_ZERAR_PADRAO) : settings.pin;
        if (state.pin === alvo) { state.pin = ''; settings.pinFails = 0; saveSettings(); const had = !!current; current = null; if (state.pinTarget === 'zerar') { zerarHistorico(); state.cf = null; toast('Histórico zerado. Tablet pronto para começar do zero.'); go('setup'); return; } go(state.pinTarget, { fin: state.pinFin, notice: had ? 'Uma pesquisa em andamento foi descartada sem gravar.' : '' }); }
        else {
          state.pin = ''; settings.pinFails = (settings.pinFails || 0) + 1;
          if (settings.pinFails >= PIN_MAX_FAILS) { settings.lockUntil = Date.now() + PIN_LOCK_MS; settings.pinFails = 0; }
          saveSettings(); toast('PIN incorreto.'); render();
        }
        return;
      } else if (state.pin.length < 8) state.pin += k;
      render(); break;
    }
    case 'admin': go('admin', { notice: '' }); break;
    case 'settings': go('settings'); break;
    case 'consolidado': if (!state.cf) state.cf = cfDefault(); go('consolidado'); break;
    case 'cfordem': if (state.cf) { state.cf.ordem = el.getAttribute('data-v') || 'melhores'; render(); } break;
    case 'novarodada': {
      const atual = rodadaNome(settings.rodada), n = allResponses().filter(r => rodadaDe(r) === settings.rodada).length;
      askConfirm(`Encerrar "${atual}" (${n} resposta${n === 1 ? '' : 's'} neste tablet) e iniciar uma nova rodada? Nada é apagado: as respostas antigas ficam no Consolidado e podem ser comparadas. As contagens da coleta atual passam a zero para todas as unidades.`, () => {
        const nova = novaRodada(); if (state.cf) { state.cf.rodada = nova.id; state.cf.comp = ''; state.cf.ano = ''; state.cf.mes = ''; state.cf.dia = ''; }
        toast(`${nova.nome} iniciada.`); go('consolidado');
      });
      break;
    }
    case 'importhist': document.getElementById('file-hist').click(); break;
    case 'csvcons': { const cf = state.cf || cfDefault(); const lst = filtrarPool(poolConsolidado().lista, cf, false); shareOrDownload(`consolidado_${cf.rodada || 'todas'}_${hojeISO()}.csv`, csvText(lst)); break; }
    case 'copycons': {
      const cf = state.cf || cfDefault(); const pool = poolConsolidado().lista; const filt = filtrarPool(pool, cf, false); const units = porUnidade(filt);
      let compMap = null; if (cf.comp) { compMap = {}; porUnidade(pool.filter(r => rodadaDe(r) === cf.comp && (!cf.unidade || r.unidade === cf.unidade))).forEach(u => { compMap[u.unidade] = u; }); }
      const ordem = { melhores: (a, b) => ((b.pctSim == null ? -1 : b.pctSim) - (a.pctSim == null ? -1 : a.pctSim)) || (b.n - a.n), piores: (a, b) => ((a.pctSim == null ? 101 : a.pctSim) - (b.pctSim == null ? 101 : b.pctSim)) || (b.n - a.n), respostas: (a, b) => b.n - a.n, nome: (a, b) => a.unidade.localeCompare(b.unidade) };
      units.sort(ordem[cf.ordem] || ordem.melhores);
      navigator.clipboard.writeText(rankingTexto(units, compMap)).then(() => toast('Ranking copiado.')).catch(() => go('text', { showText: rankingTexto(units, compMap) }));
      break;
    }
    case 'zerartudo': {
      const n = allResponses().length + histResponses().length;
      // duas etapas: pergunta Sim/Não e, depois, o PIN do avaliador (pedido do gestor)
      askConfirm(`Zerar TODO o histórico deste tablet? Somem ${n} resposta(s) de todas as unidades e rodadas, as recusas, as rodadas e as respostas importadas. O PIN e a lista de unidades ficam. Isso não tem volta. Se confirmar, o app ainda vai pedir a senha de zerar.`, () => { state.pin = ''; state.pinTarget = 'zerar'; state.pinFin = false; go('pin'); });
      break;
    }
    case 'wipehist': askConfirm(`Apagar as ${histResponses().length} respostas importadas de outros tablets? As deste tablet não são afetadas.`, () => { LS.set('mp_hist', []); toast('Importadas apagadas.'); go('consolidado'); }); break;
    case 'tocollect': go(homeScreen()); break;
    case 'tosetup': go('setup'); break;
    case 'copy': copyText(tallyText(tally(list()))); break;
    case 'showtext': go('text', { showText: tallyText(tally(list())) }); break;
    case 'csv': exportCsv(); break;
    case 'mail': {
      const t = tally(list());
      const restrito = t.identificavel || t.poucasDetalhe;   // poucas respostas: o e-mail carrega respostas quase individuais
      const subject = (restrito ? 'RESTRITO Experiência do Cliente - ' : '') + `Pesquisa equipe Maxipark - ${settings.unidade} - ${rodadaNome(settings.rodada)} - ${settings.data ? dataLabel(settings.data) : mesLabel(settings.mes)}`;
      const body = (restrito ? 'USO RESTRITO da área de Experiência do Cliente: não encaminhe ao encarregado nem ao supervisor; não divulgue por unidade.\n\n' : '') + tallyText(t).replace(/\t/g, ' | ') + '\n\n(O arquivo com as respostas sai pelo botão "arquivo de respostas" no tablet.)';
      location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      toast('Depois de enviar o e-mail, exporte também o arquivo de respostas.');
      break;   // sem markExported(): o e-mail pode ter sido cancelado
    }
    case 'resend': sendPending(); break;
    case 'wipe': {
      const n = list().length;
      const aviso = settings.exported[key()] ? '' : ' ATENÇÃO: estas respostas ainda NÃO foram exportadas.';
      askConfirm(`Apagar as ${n} respostas de ${settings.unidade} · ${rodadaNome(settings.rodada)} deste tablet?${aviso}`, () => {
        saveResponses(allResponses().filter(r => !(r.unidade === settings.unidade && rodadaDe(r) === settings.rodada)));
        const m = LS.get('mp_recusas', {}); delete m[key()]; LS.set('mp_recusas', m);
        delete settings.exported[key()]; saveSettings();
        toast('Respostas apagadas.'); go('admin', { notice: '' });
      });
      break;
    }
    case 'wipeothers': {
      askConfirm('Apagar as respostas de OUTRAS unidades e rodadas guardadas neste tablet? Elas somem do Consolidado. Confirme que já foram exportadas.', () => {
        saveResponses(allResponses().filter(r => r.unidade === settings.unidade && rodadaDe(r) === settings.rodada));
        const m = LS.get('mp_recusas', {}); Object.keys(m).forEach(k => { if (k !== key()) delete m[k]; }); LS.set('mp_recusas', m);
        toast('Outras respostas apagadas.'); go('admin', { notice: '' });
      });
      break;
    }
    case 'savesettings': {
      const u = readUnitInput('s');
      const w = document.getElementById('s-webhook').value.trim();
      if (!u) { toast('Escolha a unidade.'); return; }
      if (w && !/^https:\/\//i.test(w)) { toast('A URL de envio deve começar com https://'); return; }
      settings.unidade = u; fixarData(); settings.webhook = w; saveSettings();
      toast('Configurações salvas.'); go('admin', { notice: '' }); break;
    }
  }
}

function advance(){
  if (!current) return;
  captureObs();
  if (state.screen === 'q') {
    if (current.r[state.q] == null) return;
    if (state.q < ITENS.length - 1) go('q', { q: state.q + 1 }); else go('enps');
  } else if (state.screen === 'enps') { if (current.enps == null) return; go('ces'); }
  else if (state.screen === 'ces') { if (current.ces == null) return; go('open', { q: 0 }); }
  else if (state.screen === 'open') {
    const ta = document.getElementById('f-open');
    const v = ta ? ta.value.trim().slice(0, 600) : '';
    if (state.q === 0) { current.a1 = v; go('open', { q: 1 }); } else { current.a2 = v; submitCurrent(); }
  }
}
function back(){
  if (!current) return;
  captureObs();
  if (state.screen === 'q') { if (state.q > 0) go('q', { q: state.q - 1 }); }
  else if (state.screen === 'enps') go('q', { q: ITENS.length - 1 });
  else if (state.screen === 'ces') go('enps');
  else if (state.screen === 'open') {
    const ta = document.getElementById('f-open'); const v = ta ? ta.value.trim().slice(0, 600) : '';
    if (state.q === 0) { current.a1 = v; go('ces'); } else { current.a2 = v; go('open', { q: 0 }); }
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  handle(el.getAttribute('data-action'), el);
});
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'f-obs') { captureObs(); return; }   // comentário da página: guarda enquanto digita, sem redesenhar
  if (e.target && e.target.id === 'u-filtro') {
    state.filtro = e.target.value;
    const pos = e.target.selectionStart; render();
    const el = document.getElementById('u-filtro'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch(err) {} }
  }
});
document.getElementById('file-unidades').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
document.getElementById('file-hist').addEventListener('change', e => { const fs = e.target.files ? [...e.target.files] : []; if (fs.length) importHist(fs); e.target.value = ''; });
document.addEventListener('change', e => {   // filtros do Consolidado
  const el = e.target && e.target.closest ? e.target.closest('[data-cf]') : null;
  if (!el || !state.cf || state.screen !== 'consolidado') return;
  const k = el.getAttribute('data-cf');
  state.cf[k] = el.type === 'checkbox' ? el.checked : el.value;
  if (k === 'rodada') { state.cf.ano = ''; state.cf.mes = ''; state.cf.dia = ''; if (state.cf.comp === state.cf.rodada) state.cf.comp = ''; }
  if (k === 'ano') { state.cf.mes = ''; state.cf.dia = ''; }
  if (k === 'mes') state.cf.dia = '';
  render();
});
['touchstart','keydown','input'].forEach(ev => document.addEventListener(ev, () => armIdle(), { passive: true }));
// Botão/gesto "voltar" do Android: não sai do app; age como o "Voltar" da tela.
history.pushState({ app: 1 }, '');
window.addEventListener('popstate', () => { history.pushState({ app: 1 }, ''); });   // gesto "voltar" do Android: não sai do app e não volta de página (sem botão Voltar)
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (state.screen === 'setup') render(); });
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
state.screen = homeScreen();
render();
</script>
